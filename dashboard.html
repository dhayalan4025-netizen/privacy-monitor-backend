<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Monitor Dashboard</title>
<style>
  :root { color-scheme: light dark; --border: #8884; --muted: #888; }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .card { flex: 1; min-width: 140px; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card .n { font-size: 26px; font-weight: 700; }
  .card .l { color: var(--muted); font-size: 12px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #8883; margin: 2px 4px 2px 0; font-size: 12px; }
  .bar { height: 8px; width: 90px; background: #8883; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .bar span { display: block; height: 100%; }
  .low { background: #2ea043; } .medium { background: #d9a400; } .high { background: #e5484d; }
  .lvl { font-weight: 600; font-size: 12px; text-transform: uppercase; }
  #empty { color: var(--muted); padding: 24px 0; }
  #status { color: var(--muted); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Privacy Monitor</h1>
  <div class="sub">Websites that asked for camera, mic, location and more</div>

  <div class="cards">
    <div class="card"><div class="n" id="c-sites">0</div><div class="l">Sites tracked</div></div>
    <div class="card"><div class="n" id="c-req">0</div><div class="l">Total requests</div></div>
    <div class="card"><div class="n" id="c-high">0</div><div class="l">High risk sites</div></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Site</th><th>Permissions asked</th><th>Requests</th><th>Risk</th><th>Last seen</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="empty" hidden>No data yet. Open a website with the extension on and trigger a permission request.</div>
  <div id="status"></div>

<script>
  const rows = document.getElementById("rows");
  const empty = document.getElementById("empty");

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  async function load() {
    try {
      const key = new URLSearchParams(location.search).get("key") || "";
      const res = await fetch("/api/stats?key=" + encodeURIComponent(key));
      if (res.status === 401) { document.getElementById("status").textContent = "Wrong or missing key. Open /dashboard?key=YOUR_KEY"; return; }
      const data = await res.json();

      document.getElementById("c-sites").textContent = data.length;
      document.getElementById("c-req").textContent = data.reduce((s, d) => s + d.requests, 0);
      document.getElementById("c-high").textContent = data.filter(d => d.level === "high").length;

      rows.textContent = "";
      empty.hidden = data.length > 0;

      data.sort((a, b) => b.score - a.score).forEach(d => {
        const tr = el("tr");
        tr.appendChild(el("td", "", d.site));

        const tdP = el("td");
        d.permissions.forEach(p => tdP.appendChild(el("span", "tag", p)));
        tr.appendChild(tdP);

        tr.appendChild(el("td", "", String(d.requests)));

        const tdR = el("td");
        const bar = el("span", "bar");
        const fill = el("span", d.level);
        fill.style.width = d.score + "%";
        bar.appendChild(fill);
        tdR.appendChild(bar);
        tdR.appendChild(el("span", "lvl", d.score + " " + d.level));
        tr.appendChild(tdR);

        tr.appendChild(el("td", "", new Date(d.lastSeen).toLocaleString()));
        rows.appendChild(tr);
      });
      document.getElementById("status").textContent = "Updated " + new Date().toLocaleTimeString() + " (auto refresh every 3s)";
    } catch (e) {
      document.getElementById("status").textContent = "Cannot reach backend. Is npm start running?";
    }
  }
  load();
  setInterval(load, 3000);
</script>
</body>
</html>
